<path class="gho" d="M258 250 L314 266 L342 274"/>
<path class="pth" d="M276 140 C306 112 332 102 356 100"/>
<circle class="hd" cx="368" cy="112" r="16"/>
<path class="fig" d="M368 128 L368 212"/>
<path class="fig" d="M368 212 L370 246 L368 276"/>
<path class="fig" d="M368 212 L336 240 L318 266"/>
<text class="lb" x="150" y="200">start</text>
<text class="lb" x="398" y="112">finish</text>
</svg>
