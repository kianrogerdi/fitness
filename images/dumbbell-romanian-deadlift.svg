<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img">
<title>Dumbbell Romanian deadlift</title><desc>Side view: the standing start position drawn faintly behind the hinged finish position, with a green arc tracing the dumbbells down the thighs.</desc>
<style>
.ink{stroke:#14202a;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig{stroke:#6E49A8;fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.gho{stroke:#6E49A8;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
.hd{fill:#6E49A8}
.hdg{fill:#6E49A8;opacity:.3}
.pth{stroke:#2F8F62;fill:none;stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round}
.ld{fill:#2F8F62}
.ldg{fill:#2F8F62;opacity:.3}
.lb{fill:#5a686f;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px}
.fl{stroke:#c3cbcf;stroke-width:2;stroke-dasharray:5 5;fill:none}
@media (prefers-color-scheme:dark){
.ink{stroke:#e9eef0}
.fig,.gho{stroke:#A684E0}
.hd,.hdg{fill:#A684E0}
.pth{stroke:#5FC894}
.ld,.ldg{fill:#5FC894}
.lb{fill:#8d9ba2}
.fl{stroke:#2f3c44}
}
</style>
<line class="fl" x1="110" y1="340" x2="490" y2="340"/>
<circle class="hdg" cx="356" cy="112" r="17"/>
<path class="gho" d="M356 129 L356 216"/>
<path class="gho" d="M356 216 L358 276 L356 338"/>
<path class="gho" d="M356 146 L348 198"/>
<rect class="ldg" x="335" y="196" width="26" height="10" rx="3"/>
<path class="pth" d="M340 214 C302 234 276 252 262 266"/>
<circle class="hd" cx="214" cy="190" r="17"/>
<path class="fig" d="M231 196 L324 222"/>
<path class="fig" d="M324 222 L334 280 L318 338"/>
<path class="fig" d="M244 206 L254 268"/>
<rect class="ld" x="241" y="266" width="26" height="10" rx="3"/>
<text class="lb" x="388" y="118">start</text>
<text class="lb" x="140" y="302">finish</text>
</svg>
