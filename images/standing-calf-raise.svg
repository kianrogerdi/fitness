<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img">
<title>Standing calf raise</title><desc>Side view on a step: the heel dropped below the step shown faintly, the heel driven to full height shown solidly, with a green line marking the range.</desc>
<style>
.ink{stroke:#14202a;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig{stroke:#6E49A8;fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.gho{stroke:#6E49A8;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
.hd{fill:#6E49A8}
.hdg{fill:#6E49A8;opacity:.3}
.pth{stroke:#2F8F62;fill:none;stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round}
.ld{fill:#2F8F62}
.ldg{fill:#2F8F62;opacity:.3}
.lb{fill:#5a686f;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px}
.fl{stroke:#c3cbcf;stroke-width:2;stroke-dasharray:5 5;fill:none}
@media (prefers-color-scheme:dark){
.ink{stroke:#e9eef0}
.fig,.gho{stroke:#A684E0}
.hd,.hdg{fill:#A684E0}
.pth{stroke:#5FC894}
.ld,.ldg{fill:#5FC894}
.lb{fill:#8d9ba2}
.fl{stroke:#2f3c44}
}
</style>
<path class="ink" d="M296 304 L412 304 L412 340 L296 340"/>
<circle class="hdg" cx="270" cy="150" r="17"/>
<path class="gho" d="M270 167 L270 244"/>
<path class="gho" d="M270 180 L252 232"/>
<path class="gho" d="M270 244 L272 288 L272 322"/>
<path class="gho" d="M272 322 L316 304"/>
<path class="pth" d="M212 318 L212 282"/>
<circle class="hd" cx="270" cy="116" r="17"/>
<path class="fig" d="M270 133 L270 210"/>
<path class="fig" d="M270 146 L252 198"/>
<path class="fig" d="M270 210 L272 254 L272 288"/>
<path class="fig" d="M272 288 L316 304"/>
<text class="lb" x="108" y="306">full height</text>
<text class="lb" x="330" y="332">step</text>
</svg>
