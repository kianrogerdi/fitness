<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img">
<title>Single-leg Romanian deadlift</title><desc>Side view: standing on one leg faintly behind the hinged finish, with a green line showing head, hip and rear foot forming one straight line.</desc>
<style>
.ink{stroke:#14202a;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig{stroke:#6E49A8;fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.gho{stroke:#6E49A8;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
.hd{fill:#6E49A8}
.hdg{fill:#6E49A8;opacity:.3}
.pth{stroke:#2F8F62;fill:none;stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round}
.ld{fill:#2F8F62}
.ldg{fill:#2F8F62;opacity:.3}
.lb{fill:#5a686f;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px}
.fl{stroke:#c3cbcf;stroke-width:2;stroke-dasharray:5 5;fill:none}
@media (prefers-color-scheme:dark){
.ink{stroke:#e9eef0}
.fig,.gho{stroke:#A684E0}
.hd,.hdg{fill:#A684E0}
.pth{stroke:#5FC894}
.ld,.ldg{fill:#5FC894}
.lb{fill:#8d9ba2}
.fl{stroke:#2f3c44}
}
</style>
<line class="fl" x1="110" y1="340" x2="490" y2="340"/>
<circle class="hdg" cx="300" cy="112" r="17"/>
<path class="gho" d="M300 129 L300 216"/>
<path class="gho" d="M300 216 L302 276 L300 338"/>
<path class="gho" d="M300 216 L324 262 L332 302"/>
<path class="pth" d="M224 184 L470 198"/>
<circle class="hd" cx="238" cy="190" r="17"/>
<path class="fig" d="M255 196 L326 220"/>
<path class="fig" d="M326 220 L334 278 L322 338"/>
<path class="fig" d="M326 220 L398 208 L458 198"/>
<path class="fig" d="M262 206 L268 272"/>
<rect class="ld" x="255" y="270" width="26" height="10" rx="3"/>
<text class="lb" x="352" y="168">one straight line</text>
</svg>
